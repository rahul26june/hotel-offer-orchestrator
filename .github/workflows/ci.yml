name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # use v4, not v6

      - name: Set up Node.js
        uses: actions/setup-node@v4 # use v4, not v6
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Build docker image
        run: docker build -t hotel-offer-orchestrator .

      - name: Run Docker Compose
        run: docker compose up -d && sleep 10 && curl -f http://localhost:3000/health

      - name: Stop Docker Compose
        if: always()
        run: docker compose down
