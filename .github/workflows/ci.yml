name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build docker image
        run: docker build -t hotel-offer-orchestrator .

      - name: Run Docker compose
        run: docker-compose up -d && sleep 10 && curl -f http://localhost:3000/health || exit 1
